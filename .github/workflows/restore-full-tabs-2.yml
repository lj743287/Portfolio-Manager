name: Restore full top button tabs 2

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore previous dashboard
        run: git checkout f75189a871da6f92781e6f47ca41cf4f507e71b9 -- index.html
      - name: Patch dashboard
        run: python -c "import base64; exec(base64.b64decode(''))"
      - name: Commit restored dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/restore-full-tabs.yml .github/workflows/restore-full-tabs-2.yml
          git commit -m "Restore full market and trade analyser tabs" || exit 0
          git push
