name: Remove analysis and market controls

on:
  push:
    paths:
      - '.github/workflows/remove-analysis-market.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          s = path.read_text(encoding='utf-8')

          # Remove the two top-level shortcut buttons.
          s = re.sub(r'\n\s*<button id="marketMonitorBtn"[^>]*>.*?</button>', '', s)
          s = re.sub(r'\n\s*<button id="tradeAnalyserBtn"[^>]*>.*?</button>', '', s)

          # Remove market warning banner markup.
          s = re.sub(r'\n\s*<div id="marketBanner"[^>]*>\s*</div>\s*', '\n', s)

          # Remove market/red background CSS and market banner CSS classes.
          css_patterns = [
              r'\n\s*body\.market-negative\s*\{.*?\}',
              r'\n\s*\.marketBanner(?:[A-Za-z0-9_-]*)?\s*\{.*?\}',
              r'\n\s*\.marketPositive\s*\{.*?\}',
              r'\n\s*\.marketNeutral\s*\{.*?\}',
              r'\n\s*\.marketStats\s*\{.*?\}',
              r'\n\s*\.marketStat\s*\{.*?\}',
          ]
          for pat in css_patterns:
              s = re.sub(pat, '', s, flags=re.S)

          # Remove constants, button enable/disable, and event listeners.
          remove_line_fragments = [
              'const marketMonitorBtn',
              'const tradeAnalyserBtn',
              'const marketBanner',
              'marketMonitorBtn.disabled',
              'tradeAnalyserBtn.disabled',
              'marketMonitorBtn) marketMonitorBtn.addEventListener',
              'tradeAnalyserBtn) tradeAnalyserBtn.addEventListener',
              'renderMarketCondition();',
              "state.showMarketMonitor",
              "state.tab === 'market'",
              'data-tab="market"',
          ]
          lines = []
          for line in s.splitlines():
              if any(fragment in line for fragment in remove_line_fragments):
                  continue
              lines.append(line)
          s = '\n'.join(lines) + '\n'

          # Remove full JS functions by name.
          def remove_function(text, name):
              pattern = re.compile(r'\n\s*function\s+' + re.escape(name) + r'\s*\(')
              m = pattern.search(text)
              while m:
                  start = m.start()
                  open_brace = text.find('{', m.end())
                  if open_brace == -1:
                      return text
                  depth = 0
                  i = open_brace
                  while i < len(text):
                      ch = text[i]
                      if ch == '{':
                          depth += 1
                      elif ch == '}':
                          depth -= 1
                          if depth == 0:
                              end = i + 1
                              # Consume trailing semicolons/whitespace/newline.
                              while end < len(text) and text[end] in ' ;\t\r\n':
                                  end += 1
                              text = text[:start] + '\n' + text[end:]
                              break
                      i += 1
                  else:
                      return text
                  m = pattern.search(text)
              return text

          for fname in ['renderMarketCondition', 'openMarketMonitor', 'openTradeAnalyser', 'renderMarketAnalytics']:
              s = remove_function(s, fname)

          # Final safety: ensure the page can never turn red because of stale CSS/JS.
          s = s.replace("document.body.classList.toggle('market-negative',isNegative);", '')
          s = s.replace('document.body.classList.toggle("market-negative", isNegative);', '')

          path.write_text(s, encoding='utf-8')
          PY
      - name: Remove temporary workflow
        run: rm -f .github/workflows/remove-analysis-market.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/remove-analysis-market.yml
          git commit -m "Remove trade analyser and market condition controls" || exit 0
          git push
