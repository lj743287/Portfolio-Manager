name: Restore rich dashboard

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore rich base and patch
        run: |
          git cat-file -p 2438c863e4c81f36727280076d2d9f16e4b09e81 > index.html
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text()
          def r(a,b,n=1):
              global s
              if a not in s: raise SystemExit('missing '+a[:80])
              s=s.replace(a,b,n)
          def sub(pat,b,n=1):
              global s
              s2,c=re.subn(pat,b,s,n,flags=re.S)
              if c!=n: raise SystemExit('sub fail '+pat[:80])
              s=s2
          r('      <button id="refreshBtn" disabled>Refresh data</button>\n      <button id="settingsBtn" class="secondary">Settings</button>','      <button id="refreshBtn" disabled>Refresh data</button>\n      <button id="marketMonitorBtn" class="secondary" disabled>Market monitor</button>\n      <button id="tradeAnalyserBtn" class="secondary" disabled>Trade analyser</button>\n      <button id="settingsBtn" class="secondary">Settings</button>')
          r('</header>\n\n<main>','</header>\n\n<div id="marketBanner" class="marketBanner hidden"></div>\n\n<main>')
          r('      <div class="card"><div class="label">Unrealised P&amp;L</div><div class="value" id="unrealised">-</div><div class="sub" id="unrealisedSub">Open trades only</div></div>\n      <div class="card"><div class="label">Realised P&amp;L</div><div class="value" id="realised">-</div><div class="sub">Closed trades in sheet</div></div>','      <div class="card"><div class="label">Unrealised P&amp;L</div><div class="value" id="unrealised">-</div><div class="sub" id="unrealisedSub">Open trades only</div></div>\n      <div class="card"><div class="label">Partial realised</div><div class="value" id="partialRealised">-</div><div class="sub">Banked from open trades</div></div>\n      <div class="card"><div class="label">Realised P&amp;L</div><div class="value" id="realised">-</div><div class="sub">Closed + partial exits</div></div>')
          r('<div class="sub">Realised plus unrealised</div>','<div class="sub">Closed + partial + unrealised</div>')
          r('<div class="sub">From positions tab</div>','<div class="sub">Remaining open shares only</div>')
          r("let state = { data: null, tab: 'live', search: '', filters:","let state = { data: null, tab: 'live', search: '', showMarketMonitor: false, filters:")
          r("  const refreshBtn = el('refreshBtn');\n  const settingsBtn = el('settingsBtn');","  const refreshBtn = el('refreshBtn');\n  const marketMonitorBtn = el('marketMonitorBtn');\n  const tradeAnalyserBtn = el('tradeAnalyserBtn');\n  const settingsBtn = el('settingsBtn');")
          r("  const mainError = el('mainError');\n  const search = el('search');","  const mainError = el('mainError');\n  const marketBanner = el('marketBanner');\n  const search = el('search');")
          sub(r"  function showSetup\(\) \{.*?\n  \}\n  function showDashboard\(\) \{.*?\n  \}\n", """  function showSetup() {document.body.classList.remove('market-negative'); if(marketBanner){marketBanner.classList.add('hidden');marketBanner.innerHTML='';} const settings=getSettings(); el('webUrl').value=settings.webUrl||''; el('webSecret').value=settings.webSecret||''; setup.classList.remove('hidden'); dashboard.classList.add('hidden'); refreshBtn.disabled=true; if(marketMonitorBtn)marketMonitorBtn.disabled=true; if(tradeAnalyserBtn)tradeAnalyserBtn.disabled=true;}\n  function showDashboard() {setup.classList.add('hidden');dashboard.classList.remove('hidden');refreshBtn.disabled=false;if(marketMonitorBtn)marketMonitorBtn.disabled=false;if(tradeAnalyserBtn)tradeAnalyserBtn.disabled=false;}\n""")
          sub(r"  function enrichOpen\(\) \{.*?\n  \}\n\n  function render\(\)", """  function enrichOpen() {const smap=stopsById();return getOpenPositions().map(p=>{const s=smap[p.id]||{};const shares=num(p.shares)||0;const avgEntry=num(p.avgEntry)||0;const lastClose=num(s.lastClose);const cost=num(p.costBasisUsd)??shares*avgEntry;const value=lastClose!=null?shares*lastClose:null;const pnl=value!=null?value-cost:null;const partialRealized=num(p.realizedUsd)||0;const totalTradePnl=partialRealized+(pnl||0);const pnlPct=cost?(pnl/cost)*100:null;return {...p,stop:s,shares,avgEntry,lastClose,cost,value,pnl,pnlPct,partialRealized,totalTradePnl};});}\n  function renderMarketCondition(){const mc=state.data?.marketCondition||null;const status=String(mc?.status||'').toLowerCase();const isNegative=status==='negative';document.body.classList.toggle('market-negative',isNegative);if(!marketBanner)return;if(!isNegative&&!state.showMarketMonitor){marketBanner.classList.add('hidden');marketBanner.innerHTML='';return;}const fastDays=mc?.fastDays||10,slowDays=mc?.slowDays||20,proxy=mc?.proxy||'ONEQ';const fast=num(mc?.fastMa),slow=num(mc?.slowMa),close=num(mc?.close);const isPositive=status==='positive'||status==='good';const title=isNegative?'⚠ Market conditions negative':isPositive?'✅ Market conditions positive':'ℹ Market monitor';const msg=mc?.message||(isNegative?`${proxy} ${fastDays}MA is below its ${slowDays}MA. Reduce aggression, avoid marginal setups and respect sell signals.`:isPositive?`${proxy} ${fastDays}MA is above its ${slowDays}MA. Conditions are supportive by your market proxy.`:`${proxy} market condition data is not available yet.`);marketBanner.classList.remove('hidden','marketPositive','marketNeutral');if(isPositive)marketBanner.classList.add('marketPositive');if(!isNegative&&!isPositive)marketBanner.classList.add('marketNeutral');marketBanner.innerHTML=`<div class=\"marketBannerTitle\">${escapeHtml(title)}</div><div class=\"marketBannerText\">${escapeHtml(msg)}</div><div class=\"marketStats\"><span class=\"marketStat\">Proxy: ${escapeHtml(proxy)}</span><span class=\"marketStat\">${fastDays}MA: ${fast!=null?money(fast):'-'}</span><span class=\"marketStat\">${slowDays}MA: ${slow!=null?money(slow):'-'}</span><span class=\"marketStat\">Close: ${close!=null?money(close):'-'}</span><span class=\"marketStat\">Updated: ${escapeHtml(mc?.latestDate||state.data?.generatedAt||'-')}</span></div>`;}\n  function openMarketMonitor(){if(!state.data){loadData();return;}state.showMarketMonitor=true;state.tab='market';render();setTimeout(()=>el('tablePanel')?.scrollIntoView({behavior:'smooth',block:'start'}),50);}\n  function openTradeAnalyser(){if(!state.data){loadData();return;}state.tab='strategy';render();setTimeout(()=>el('tablePanel')?.scrollIntoView({behavior:'smooth',block:'start'}),50);}\n\n  function render()""")
          r("    const realised = num(summary.realisedUsd) || closed.reduce((a, p) => a + (num(p.realizedUsd) || 0), 0);\n    const total = unrealised + realised;","    const partialRealised = open.reduce((a,p)=>a+(p.partialRealized||0),0);\n    const closedRealised = closed.reduce((a,p)=>a+(num(p.realizedUsd)||0),0);\n    const realised = closedRealised + partialRealised;\n    const total = unrealised + realised;")
          r("    setText('realised', money(realised), cls(realised));","    setText('partialRealised', money(partialRealised), cls(partialRealised));\n    setText('realised', money(realised), cls(realised));")
          r("    renderFilterOptions();","    renderMarketCondition();\n    renderFilterOptions();")
          r("pnlPass(p.pnl || 0)","pnlPass(p.totalTradePnl || 0)")
          r("    const realised = closedPnl.reduce((a, b) => a + b, 0);\n    const unrealised = open.reduce((a, p) => a + (p.pnl || 0), 0);\n    const total = realised + unrealised;","    const closedRealised = closedPnl.reduce((a,b)=>a+b,0);\n    const partialRealised = open.reduce((a,p)=>a+(p.partialRealized||0),0);\n    const realised = closedRealised + partialRealised;\n    const unrealised = open.reduce((a,p)=>a+(p.pnl||0),0);\n    const total = realised + unrealised;")
          r("return { open, closed, closedPnl, wins, losses, flats, realised, unrealised, total, grossWin, grossLoss, openWinners, openLosers, avgHold, best, worst, partialTrades, totalStopRisk };","return { open,closed,closedPnl,wins,losses,flats,closedRealised,partialRealised,realised,unrealised,total,grossWin:grossWin+Math.max(0,partialRealised),grossLoss:grossLoss+Math.abs(Math.min(0,partialRealised)),openWinners,openLosers,avgHold,best,worst,partialTrades,totalStopRisk };")
          r("bucket(p.entryDate).unrealised += p.pnl || 0;","bucket(p.entryDate).realised += p.partialRealized || 0;\n      bucket(p.entryDate).unrealised += p.pnl || 0;")
          r("return open.slice().sort((a, b) => (b.pnl || 0) - (a.pnl || 0)).map(p => ({ label: p.symbol, value: p.pnl || 0, kind: (p.pnl || 0) >= 0 ? 'barGood' : 'barBad' }));","return open.slice().sort((a,b)=>(b.totalTradePnl||0)-(a.totalTradePnl||0)).map(p=>({label:p.symbol,value:p.totalTradePnl||0,kind:(p.totalTradePnl||0)>=0?'barGood':'barBad'}));")
          r("It uses realised P&amp;L from closed trades plus unrealised P&amp;L from the latest refreshed closes.","It uses realised P&amp;L from closed trades, banked partial exits on open trades, plus unrealised P&amp;L from the latest refreshed closes.")
          r("${metricCard('Realised P&L', signedMoney(st.realised), signedPct(realisedPct), cls(st.realised))}\n        ${metricCard('Unrealised P&L', signedMoney(st.unrealised), signedPct(unrealisedPct), cls(st.unrealised))}","${metricCard('Realised P&L', signedMoney(st.realised), signedPct(realisedPct), cls(st.realised))}\n        ${metricCard('Partial realised', signedMoney(st.partialRealised || 0), 'Banked from still-open trades', cls(st.partialRealised || 0))}\n        ${metricCard('Unrealised P&L', signedMoney(st.unrealised), signedPct(unrealisedPct), cls(st.unrealised))}")
          r("${metricCard('Realised P&L', signedMoney(st.realised), 'Closed trades only', cls(st.realised))}\n        ${metricCard('Unrealised P&L', signedMoney(st.unrealised), `${st.openWinners} open winners · ${st.openLosers} open losers`, cls(st.unrealised))}","${metricCard('Closed realised', signedMoney(st.closedRealised || 0), 'Fully closed trades only', cls(st.closedRealised || 0))}\n        ${metricCard('Partial realised', signedMoney(st.partialRealised || 0), 'Banked from still-open trades', cls(st.partialRealised || 0))}\n        ${metricCard('Total realised P&L', signedMoney(st.realised), 'Closed + partial exits', cls(st.realised))}\n        ${metricCard('Unrealised P&L', signedMoney(st.unrealised), `${st.openWinners} open winners · ${st.openLosers} open losers`, cls(st.unrealised))}")
          mf="""  function renderMarketAnalytics(){const mc=state.data?.marketCondition||{};const status=String(mc.status||'unknown').toLowerCase();const isNeg=status==='negative',isPos=status==='positive'||status==='good';const proxy=mc.proxy||'ONEQ',fastDays=mc.fastDays||10,slowDays=mc.slowDays||20;const fast=num(mc.fastMa),slow=num(mc.slowMa),close=num(mc.close);const spread=fast!=null&&slow!=null?fast-slow:null;const spreadPct=fast!=null&&slow!=null&&slow!==0?((fast-slow)/slow)*100:null;const statusLabel=isNeg?'Negative':isPos?'Positive':'Unknown';const statusClass=isNeg?'neg':isPos?'pos':'warn';const message=mc.message||(isNeg?`${proxy} ${fastDays}MA is below its ${slowDays}MA. Reduce aggression, avoid marginal setups and respect sell signals.`:isPos?`${proxy} ${fastDays}MA is above its ${slowDays}MA. Market conditions are supportive.`:`${proxy} market condition data is not available yet.`);const bars=[{label:'Close',value:close||0,kind:'barNeutral'},{label:`${fastDays}MA`,value:fast||0,kind:isNeg?'barBad':'barGood'},{label:`${slowDays}MA`,value:slow||0,kind:'barWarn'}].filter(x=>x.value!==0);const spreadBars=[{label:`${fastDays}MA minus ${slowDays}MA`,value:spread||0,kind:spread!=null&&spread>=0?'barGood':'barBad'}];const charts=bars.length?`<div class=\"chartGrid\">${barChart(`${proxy} market proxy`,`Latest close versus ${fastDays}MA and ${slowDays}MA. Your regime rule is positive when ${fastDays}MA is above ${slowDays}MA.`,bars,{kind:'money'})}${barChart('Market regime spread',`Positive spread means ${fastDays}MA is above ${slowDays}MA. Negative spread means defensive market conditions.`,spreadBars,{kind:'money',diverging:true})}</div>`:`<div class=\"empty\">No market chart data available yet. Refresh stops/prices in the Google Sheet and refresh this dashboard.</div>`;el('statusline').textContent=`Market monitor · ${proxy} · ${statusLabel}`;el('tablePanel').innerHTML=`<div class=\"section\"><h2>Market monitor</h2><div class=\"noteBox\"><strong class=\"${statusClass}\">${escapeHtml(statusLabel)} market conditions</strong><br>${escapeHtml(message)}</div><div class=\"miniGrid\">${metricCard('Market status',statusLabel,`${proxy} ${fastDays}MA versus ${slowDays}MA`,statusClass)}${metricCard('Proxy',proxy,'Market regime indicator')}${metricCard('Latest close',close!=null?money(close):'-',escapeHtml(mc.latestDate||state.data.generatedAt||'-'))}${metricCard(`${fastDays}MA`,fast!=null?money(fast):'-','Fast moving average',isNeg?'neg':isPos?'pos':'warn')}${metricCard(`${slowDays}MA`,slow!=null?money(slow):'-','Slow moving average')}${metricCard('MA spread',spread!=null?signedMoney(spread):'-',spreadPct!=null?signedPct(spreadPct):'Fast MA minus slow MA',spread!=null&&spread>=0?'pos':'neg')}</div></div><div class=\"section\"><h2>Market status charts</h2>${charts}</div><div class=\"section\"><div class=\"noteBox\">Rule: conditions are positive when ${escapeHtml(proxy)} ${fastDays}MA is above its ${slowDays}MA. Conditions are negative when ${fastDays}MA is below ${slowDays}MA.</div></div>`;}\n\n"""
          r('  function renderPortfolio() {', mf+'  function renderPortfolio() {')
          r("    if (state.tab === 'strategy') return renderStrategy();\n    if (state.tab === 'closed') return renderClosed();","    if (state.tab === 'strategy') return renderStrategy();\n    if (state.tab === 'market') return renderMarketAnalytics();\n    if (state.tab === 'closed') return renderClosed();")
          r("  settingsBtn.addEventListener('click', showSetup);\n  refreshBtn.addEventListener('click', loadData);","  settingsBtn.addEventListener('click', showSetup);\n  if (marketMonitorBtn) marketMonitorBtn.addEventListener('click', openMarketMonitor);\n  if (tradeAnalyserBtn) tradeAnalyserBtn.addEventListener('click', openTradeAnalyser);\n  refreshBtn.addEventListener('click', loadData);")
          sub(r"  function renderLive\(\) \{.*?\n  \}\n\n  function renderStops", """  function renderLive() {const rows=filteredOpenPositions().map(p=>{const pnlType=p.totalTradePnl==null?'':(p.totalTradePnl>=0?'pos':'neg');return `<tr><td><strong>${escapeHtml(p.symbol)}</strong></td><td>${escapeHtml(p.entryDate)}</td><td>${p.shares.toLocaleString('en-GB')}</td><td>${money(p.avgEntry)}</td><td>${p.lastClose==null?'-':money(p.lastClose)}</td><td>${p.value==null?'-':money(p.value)}</td><td class=\"${cls(p.pnl||0)}\">${p.pnl==null?'-':money(p.pnl)}</td><td class=\"${cls(p.partialRealized||0)}\">${money(p.partialRealized||0)}</td><td class=\"${pnlType}\"><strong>${money(p.totalTradePnl||0)}</strong></td><td class=\"${cls(p.pnlPct||0)}\">${p.pnlPct==null?'-':pct(p.pnlPct)}</td><td>${chip(p.stop.stopType||'Awaiting',p.stop.stopType==='Awaiting'?'warn':'good')}</td></tr>`;});table(['Symbol','Entry date','Shares','Avg entry','Last close','Value','Unrealised','Partial realised','Total trade P&L','P&L %','Stop type'],rows);}\n\n  function renderStops""")
          p.write_text(s)
          print('ok',len(s),'strategyStats' in s,'renderMarketAnalytics' in s,'partialRealized' in s)
          PY
      - name: Commit restored dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/restore-full-tabs.yml .github/workflows/restore-full-tabs-2.yml .github/workflows/restore-good.yml .github/workflows/patch-full-tabs.yml .github/workflows/patch-full-views.yml .github/workflows/restore-v17-rich.yml
          git add -A
          git commit -m "Restore rich trade analytics and market monitor" || exit 0
          git push