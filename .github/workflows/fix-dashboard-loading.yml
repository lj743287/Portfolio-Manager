name: Fix dashboard loading
on:
  push:
    paths:
      - '.github/workflows/fix-dashboard-loading.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index loading bug
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          s = s.replace("    body.market-negative header {\n      background: rgba(42, 15, 18, 0.94);\n      border-bottom-color: rgba(248, 113, 113, .55);\n    }\n", "")

          s = s.replace("    .marketBanner .marketStats {\n      display: inline-flex;\n      gap: 10px;\n      flex-wrap: wrap;\n      margin-top: 8px;\n    }\n    .marketBanner .marketStat {\n      border: 1px solid rgba(254, 202, 202, .35);\n      background: rgba(2, 6, 23, .22);\n      border-radius: 999px;\n      padding: 4px 8px;\n      font-size: 12px;\n      font-weight: 800;\n    }\n\n", "")

          s = s.replace("    document.body.classList.remove('market-negative');\n    if (marketBanner) { marketBanner.classList.add('hidden'); marketBanner.innerHTML = ''; }\n", "")

          s = s.replace("    el('statusline').textContent = isCoachAction ? 'Generating Trade Coach...' : 'Loading from Google Sheet...';", "    el('statusline').textContent = 'Loading from Google Sheet...';")

          if 'isCoachAction' in s:
              raise SystemExit('isCoachAction reference still present')
          if 'marketBanner' in s:
              raise SystemExit('marketBanner reference still present')
          if 'market-negative' in s:
              raise SystemExit('market-negative reference still present')

          p.write_text(s, encoding='utf-8')
          PY
      - name: Remove temporary workflow
        run: rm -f .github/workflows/fix-dashboard-loading.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-dashboard-loading.yml
          git commit -m "Fix dashboard loading after coach removal"
          git push
