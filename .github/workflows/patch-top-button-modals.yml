name: Patch top button modals

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
      - name: Decode patch script
        run: echo '' | base64 -d > patch_buttons.py
      - name: Run patch
        run: python patch_buttons.py
      - name: Commit patched dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/patch-top-button-modals.yml
          git commit -m "Fix top button modal behaviour" || exit 0
          git push
