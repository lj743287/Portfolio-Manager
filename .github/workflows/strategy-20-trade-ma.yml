name: Strategy 20-trade MA charts
on:
  push:
    paths:
      - '.github/workflows/strategy-20-trade-ma.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text()

          new_function = r'''function closedPerformanceTrend(st) {
  const closed = (st.closed || [])
    .slice()
    .filter(p => p.exitDate)
    .sort((a, b) => String(a.exitDate).localeCompare(String(b.exitDate)) || String(a.symbol || '').localeCompare(String(b.symbol || '')));

  const rows = [];
  for (let i = 0; i < closed.length; i++) {
    const window = closed.slice(Math.max(0, i - 19), i + 1);
    if (window.length < 20) continue;
    const pnls = window.map(p => num(p.realizedUsd) || 0);
    const wins = pnls.filter(v => v > 0);
    const losses = pnls.filter(v => v < 0);
    const realised = pnls.reduce((a, v) => a + v, 0);
    const latest = closed[i];
    rows.push({
      label: String(latest.symbol || '') + ' ' + shortDateLabel(latest.exitDate),
      winRate: (wins.length / window.length) * 100,
      avgWin: wins.length ? wins.reduce((a, v) => a + v, 0) / wins.length : null,
      avgLoss: losses.length ? losses.reduce((a, v) => a + v, 0) / losses.length : null,
      expectancy: realised / window.length
    });
  }
  return rows;
}'''

          pattern = re.compile(r"function closedPerformanceTrend\(st\) \{.*?\n\}", re.S)
          s, count = pattern.subn(new_function, s, count=1)
          if count != 1:
              raise SystemExit(f'Expected to replace one closedPerformanceTrend function, replaced {count}')

          replacements = {
            "lineChart('Win rate over time', 'Cumulative win rate after each closed trade, sorted by exit date.'": "lineChart('Win rate 20-trade MA', 'Rolling win rate over the last 20 closed trades, sorted by exit date.'",
            "lineChart('Average win over time', 'Cumulative average realised profit of winning closed trades.'": "lineChart('Average win 20-trade MA', 'Rolling average realised profit of winning trades over the last 20 closed trades.'",
            "lineChart('Average loss over time', 'Cumulative average realised loss of losing closed trades.'": "lineChart('Average loss 20-trade MA', 'Rolling average realised loss of losing trades over the last 20 closed trades.'",
            "lineChart('Expectancy over time', 'Cumulative average realised P&L per closed trade.'": "lineChart('Expectancy 20-trade MA', 'Rolling average realised P&L per trade over the last 20 closed trades.'"
          }
          for old, new in replacements.items():
              if old in s:
                  s = s.replace(old, new)

          # In case the previous 20-day patch partially landed before this correction, normalise that wording too.
          replacements_20d = {
            "lineChart('Win rate over time', '20-day moving average of closed-trade win rate, grouped by exit date.'": "lineChart('Win rate 20-trade MA', 'Rolling win rate over the last 20 closed trades, sorted by exit date.'",
            "lineChart('Average win over time', '20-day moving average of realised profit on winning closed trades.'": "lineChart('Average win 20-trade MA', 'Rolling average realised profit of winning trades over the last 20 closed trades.'",
            "lineChart('Average loss over time', '20-day moving average of realised loss on losing closed trades.'": "lineChart('Average loss 20-trade MA', 'Rolling average realised loss of losing trades over the last 20 closed trades.'",
            "lineChart('Expectancy over time', '20-day moving average of realised P&L per closed trade.'": "lineChart('Expectancy 20-trade MA', 'Rolling average realised P&L per trade over the last 20 closed trades.'"
          }
          for old, new in replacements_20d.items():
              if old in s:
                  s = s.replace(old, new)

          if 'i - 19' not in s or 'window.length < 20' not in s:
              raise SystemExit('20-trade rolling window logic missing')
          if '20-day moving average' in s or 'Cumulative win rate after each closed trade' in s:
              raise SystemExit('Old chart wording still present')
          if 'Win rate 20-trade MA' not in s or 'Expectancy 20-trade MA' not in s:
              raise SystemExit('20-trade MA chart titles missing')

          p.write_text(s)
          PY
      - name: Remove temporary workflow
        run: rm -f .github/workflows/strategy-20-trade-ma.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/strategy-20-trade-ma.yml
          git commit -m "Use 20-trade moving averages for strategy charts"
          git push
