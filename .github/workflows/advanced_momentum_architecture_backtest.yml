name: Advanced Momentum Architecture Backtest

on:
  push:
    paths:
      - ".github/workflows/advanced_momentum_architecture_backtest.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-history:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install --quiet pandas requests
      - name: Fetch historical candles
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: |
          cat > /tmp/fetch_history.py <<'PY'
          import os, time, json
          import requests, pandas as pd

          key=os.environ.get('TWELVEDATA_API_KEY','').strip()
          if not key: raise SystemExit('TWELVEDATA_API_KEY missing')
          symbols='AAON,ACAD,ACHC,ACMR,AFRM,AGL,AGYS,AIN,AKAM,ALOT,AMBQ,AMKR,AMTX,AMWL,ANL,AP,APEI,ARM,AVT,BBCP,BBY,BDSX,BE,BHE,BLFS,BMA,BVS,BWEN,CADL,CBRL,CCCC,CDXS,CGNX,CLYM,CNC,COCO,CON,CRDO,CRSR,CRUD,CTRN,CTS,CVGI,DFTX,DSGN,DTIL,DY,EPC,ESOA,EVER,EVH,FBYD,FENC,FLXS,FNKO,FORR,FSTR,GEO,GHM,GLNG,GO,HLIT,HOV,HPK,HPP,HSTM,HUM,ICCC,ICHR,ICU,III,ILMN,INVA,JRSH,KALV,KFRC,KN,KNSA,KODK,KRO,LASR,LFST,LINC,LIND,LION,LJP3,LMT,LNZA,LQDA,LSCC,LXRX,MATV,MLKN,MLTX,MOV,MOVE,MRX,MYRG,NAVN,NBR,NVAX,NWPX,ODC,OII,OMDA,ON,OPHC,OSPN,OTLY,PANW,PAY,PAYS,PBF,PBI,PD,PGNY,QFIN,QMCO,RAL,RCMT,RDNT,RDVT,RFIL,RIOT,RMAU,RRGB,SATL,SCHL,SDGR,SEZL,SHEN,SHIP,SIF,SIMO,SND,SOLS,SPCX,SPHR,STAA,SWKS,SYRE,TK,TMCI,TNGX,TPG,UFI,UMC,VOYA,VRT,VSXY,WKC,XGN,XMTR,XNCR,YOU'.split(',')
          rows=[]; errors=[]; calls=0; window_start=time.time()
          for i,sym in enumerate(symbols,1):
              if calls>=45:
                  elapsed=time.time()-window_start
                  if elapsed<65: time.sleep(65-elapsed)
                  calls=0; window_start=time.time()
              params={'symbol':sym,'interval':'1day','start_date':'2025-11-01','end_date':'2026-09-05','order':'ASC','format':'JSON','outputsize':500,'apikey':key}
              try:
                  r=requests.get('https://api.twelvedata.com/time_series',params=params,timeout=30)
                  calls+=1
                  if r.status_code==429:
                      time.sleep(65); window_start=time.time(); calls=1
                      r=requests.get('https://api.twelvedata.com/time_series',params=params,timeout=30)
                  r.raise_for_status(); p=r.json()
                  if p.get('status')=='error': raise RuntimeError(p.get('message','Twelve Data error'))
                  vals=p.get('values',[])
                  if not vals: raise RuntimeError('no candles')
                  for v in vals:
                      rows.append({'symbol':sym,'datetime':v.get('datetime'),'open':v.get('open'),'high':v.get('high'),'low':v.get('low'),'close':v.get('close'),'volume':v.get('volume')})
                  print(f'[{i}/{len(symbols)}] {sym}: {len(vals)}')
              except Exception as e:
                  errors.append({'symbol':sym,'error':str(e)}); print('ERROR',sym,e)
          pd.DataFrame(rows).to_csv('daily-history.csv',index=False)
          with open('history-errors.json','w') as f: json.dump(errors,f,indent=2)
          print('rows',len(rows),'errors',len(errors))
          PY
          python /tmp/fetch_history.py
      - name: Upload historical data
        uses: actions/upload-artifact@v4
        with:
          name: momentum-architecture-history
          path: |
            daily-history.csv
            history-errors.json
          retention-days: 1
