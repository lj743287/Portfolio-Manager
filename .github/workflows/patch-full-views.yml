name: Patch full top button views

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
      - name: Patch dashboard full views
        run: |
          python -c "import base64; exec(base64.b64decode('').decode())"
      - name: Commit patched dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/patch-full-views.yml
          git commit -m "Restore full market and trade analyser views" || exit 0
          git push
